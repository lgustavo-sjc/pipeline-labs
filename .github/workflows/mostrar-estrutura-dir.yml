name: "Estrutura de Diretórios e Arquivos - Parte 2"

on:
  push:
    branches: [ main ]
#   paths-ignore:
#     - '.github/workflows/**'  # Executa apenas se houver alterações nos workflows
  workflow_dispatch:
    inputs:
      environment:
        description: 'Escolha o ambiente de execução'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
          - development
  #schedule:
  #  - cron: '*/30 * * * *'
env:
    NODE_VERSION: '18'

jobs:
  demonstrar-estrutura-parte2:
    name: "Demonstrar Estrutura - Parte 2"
    runs-on: ubuntu-24.04    
    environment: ${{ inputs.environment || 'prod' }}
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Mostrar URL
        run: |
          echo "Nome da URL: ${{vars.URL}}"
      
      - name: Mostrar estrutura .github/workflows
        run: |
          echo "=== ESTRUTURA DO DIRETÓRIO .github/workflows ==="
          ls -la .github/workflows/
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows/*.y*ml 2>/dev/null | wc -l)"
      
      - name: Elementos obrigatórios do workflow
        run: |
          echo "=== ELEMENTOS OBRIGATÓRIOS ==="
          echo "1. name: Nome do workflow"
          echo "2. on: Eventos de trigger (push, workflow_dispatch)"
          echo "3. jobs: Tarefas a executar"
      
      - name: Variáveis e contextos
        run: |
          echo "=== VARIÁVEIS E CONTEXTOS ==="
          echo "Variável env: ${{ env.NODE_VERSION }}"
          echo "Variável env: ${{ env.NODE_VERSION }}"
          echo "Repositório: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"