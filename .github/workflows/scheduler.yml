name: "Lab 01 - Estrutura de Diretórios e Arquivos"

on: 
  schedule:
    - cron: '*/5 * * * *'  # Executa a cada 5 minutos
  workflow_dispatch:  # Permite execução manual pela interface



jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar script de agendamento
        run: |
          echo "Executando script de agendamento..."
          # Adicione aqui os comandos que você deseja executar a cada 5 minutos
          echo "HORA UTC: $(date -u)"
          echo "TIMEZONE: $(date +%Z)"
        
      - name: Relatório Diário
        run: |
          echo "Gerando relatório diário..."
          echo "Total de commits? $(git rev-list --all --count)"
          echo "Contribuições únicos $(git shortlog -sne | wc -l)"
          echo "Ultimo commit: $(git log -1 --pretty=format:'%h - %an, %ar : %s')"
    



